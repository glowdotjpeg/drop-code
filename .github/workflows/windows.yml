name: Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "windows-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: .\Windows\scripts\build.ps1 -Architecture x64 -Config Release

      - name: Package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^(?:windows-)?v(.+)$') { $Matches[1] } else { '0.2.0' }
          .\Windows\scripts\package-release.ps1 -Version $version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DropCode-windows-x64
          path: |
            Windows/dist/*.zip
            Windows/dist/*.sha256

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Windows/dist/*.zip
            Windows/dist/*.sha256
